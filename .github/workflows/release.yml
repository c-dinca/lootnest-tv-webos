name: Release
run-name: "Release ${{ github.event.release.tag_name || github.ref_name }}"

# A pushed tag such as v1.0.0 makes the release; a release published by
# hand gets its package too.
on:
  push:
    tags: [ "v*.*.*" ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release

# The release gets its .ipk attached by the job below.
permissions:
  contents: write

jobs:
  release-webos:
    name: Release (webOS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # the version comes from git describe --tags

      - name: Download ares-cli-rs
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/ares-cli-rs"
          latest: true
          fileName: "ares-package_*_amd64.deb"
          out-file-path: "temp"

      - name: Download Manifest Generator
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/dev-toolbox-cli"
          latest: true
          fileName: "webosbrew-toolbox-gen-manifest_*_amd64.deb"
          out-file-path: "temp"

      - name: Update Packages
        run: sudo apt-get -yq update

      - name: Install webOS CLI
        run: sudo apt-get install ./temp/*.deb

      - name: webOS Build
        uses: ./.github/actions/build-webos
        with:
          build-type: RelWithDebInfo

      - name: Create Release (webOS)
        id: create_release_webos
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name || github.ref_name }}
          name: Lootnest for TV ${{ github.event.release.tag_name || github.ref_name }}
          body: "Lootnest for TV for LG webOS TVs. Lootnest on the PC installs it from Settings, TV, Add an LG TV. Based on Moonlight TV (GPL v3); the source is this repository at this tag."
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: dist/*.ipk,dist/*_dbgsym.tar.gz,dist/*.manifest.json
