name: Release
run-name: "Release"

# A push to main whose VERSION has no release yet makes that release
# (tag v<VERSION> on that commit) with the .ipk; a release published by
# hand gets its package too.
on:
  push:
    branches: [ main ]
    paths: [ VERSION ]
  release:
    types: [ published ]

env:
  BUILD_TYPE: Release

# The release gets its .ipk attached by the job below.
permissions:
  contents: write

jobs:
  release-webos:
    name: Release (webOS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then tag="${{ github.event.release.tag_name }}"; else tag="v$(tr -d '[:space:]' < VERSION)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Download ares-cli-rs
        if: steps.ver.outputs.skip != 'true'
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/ares-cli-rs"
          latest: true
          fileName: "ares-package_*_amd64.deb"
          out-file-path: "temp"

      - name: Download Manifest Generator
        if: steps.ver.outputs.skip != 'true'
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "webosbrew/dev-toolbox-cli"
          latest: true
          fileName: "webosbrew-toolbox-gen-manifest_*_amd64.deb"
          out-file-path: "temp"

      - name: Update Packages
        if: steps.ver.outputs.skip != 'true'
        run: sudo apt-get -yq update

      - name: Install webOS CLI
        if: steps.ver.outputs.skip != 'true'
        run: sudo apt-get install ./temp/*.deb

      - name: webOS Build
        if: steps.ver.outputs.skip != 'true'
        uses: ./.github/actions/build-webos
        with:
          build-type: RelWithDebInfo

      - name: Create Release (webOS)
        if: steps.ver.outputs.skip != 'true'
        id: create_release_webos
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.ver.outputs.tag }}
          commit: ${{ github.sha }}
          name: Lootnest for TV ${{ steps.ver.outputs.tag }}
          body: "Lootnest for TV for LG webOS TVs. Lootnest on the PC installs it from Settings, TV, Add an LG TV. Based on Moonlight TV (GPL v3); the source is this repository at this tag."
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: dist/*.ipk,dist/*_dbgsym.tar.gz,dist/*.manifest.json
